name: ScamShield OSS CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # 1. Frontend Test & Lint Validation
  # ============================================================================
  frontend-tests:
    name: Frontend Verification (Next.js 16 + Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Calibrated Heuristic Verification Suite
        run: npm test

  # ============================================================================
  # 2. Python Backend & Heuristic Engine Verification
  # ============================================================================
  backend-tests:
    name: Backend Verification (FastAPI + Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Calibrated Risk Scoring Test Suite
        run: python backend/tests/test_scam_engine.py

      - name: Run FastAPI Endpoint Integration Tests
        run: pytest backend/tests
