services:
  # Next.js 16 Web Frontend Layer (Port 3000)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scamshield-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    depends_on:
      - backend

  # FastAPI Python Threat Engine (Port 8000)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scamshield-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEFAULT_MODEL=gemma4:e2b
      - OLLAMA_TIMEOUT_SECONDS=20.0
    extra_hosts:
      # Allows backend container to connect directly to host machine's Ollama daemon
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
